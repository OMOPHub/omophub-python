name: Groundworkers plugin

on:
  pull_request:
    paths:
      - 'plugins/groundworkers/**'
      - '.github/workflows/groundworkers-plugin.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/groundworkers/**'
      - '.github/workflows/groundworkers-plugin.yml'

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/groundworkers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and install the wheel
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
          python -m pip check
      - name: Test release verification and Groundworkers discovery
        run: python -m unittest discover -s tests -v
